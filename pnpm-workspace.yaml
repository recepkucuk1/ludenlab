packages:
  - "apps/*"
  - "packages/*"

# pnpm 10/11 bağımlılık install/build script'lerini varsayılan çalıştırmaz ve
# strictDepBuilds=true ile install'ı FAIL eder → Hostinger'da ERR_PNPM_IGNORED_BUILDS.
# pnpm 9 (yerel/CI) zaten hepsini çalıştırıyor; Hostinger pnpm 11 de aynı davransın.
#
# ⚠️ AÇIK GÜVENLİK BULGUSU: #33 (tedarik zinciri) — bu ayar TÜM bağımlılıkların
# install script'lerini prod kurulumunda çalıştırır. `onlyBuiltDependencies` allow-list'ine
# daraltmak DENENDİ (b5952b8) ve HOSTINGER DEPLOY'U SESSİZCE DURDU: allow-list yerel
# macOS node_modules taranarak çıkarılmıştı, Hostinger ise Linux — orada install script'i
# olan paket kümesi FARKLI. Eksik kalan her paket için pnpm build'i atlar/ıskalar ve
# kurulum bu ortamda ilerlemedi; iki tur güvenlik düzeltmesi 3 saat canlıya çıkamadı.
#
# DOĞRU YOL (yeniden denerken): listeyi LINUX kurulumundan çıkar (Hostinger build log'u ya
# da linux container'da `pnpm install` sonrası `.pnpm` taraması), tek başına küçük bir
# commit'le gönder ve deploy'u ETAG DEĞİŞİMİYLE doğrula. Bu ayarı başka değişikliklerle
# aynı commit'e koyma — patladığında hangisi olduğu anlaşılmıyor.
dangerouslyAllowAllBuilds: true
strictDepBuilds: false

# Dolaylı bağımlılık CVE yamaları (`pnpm audit`, CI "Bağımlılık denetimi" adımı).
# Her satır yalnız açığı olan sürüm hattını hedefler — üst paket yaması gelince
# ilgili satır silinebilir; `pnpm audit` 0'dan sapıyorsa önce buraya bak (2026-11-07).
